services:
  db:
    image: postgres:16
    container_name: credo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: credo
      POSTGRES_DB: credo
    ports:
      - "5432:5432"
    volumes:
      - credo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credo"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  credo-pgdata:
